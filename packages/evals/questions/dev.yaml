# Development questions of the role eval (technical.md § 13.1). The initial
# corpus questions came from U03 (LOG-12) profiling; U15 adds an ambiguous
# routing question that needs no corpus figures. These are development and
# regression questions, never holdout: the author of this file writes no
# holdout questions and does not see them (U16).
#
# Per question: kind, role (null = no role prompt), effective_role (expected
# routing result, null for the ambiguous routing control), scope, required
# evidence, distinguishing check, allowed tool sequences and acceptance cases.
# effective_role and every expectation below are rater metadata, never agent
# input. Auto questions must infer the role without receiving effective_role.
# `reference` preserves historical profiling annotations, with provenance pinned
# below. They were not rerun on the current data and are never numerical pass
# expectations or answer evidence. Some original annotations use a wider scope
# than the question; see audit.md. Current numbers and hypotheses require the
# current run's receipts and their actual scope, population and truncation.
# `demo` marks the questions rehearsed for the live demo (concept 11.1);
# rehearsed questions never count as holdout.

version: 2
reference_data_version: dv_263e378cd8560c4a
reference_status: historical_unverified
reference_provenance:
  - a72f40f336aa4a3bfece96e5490469588c7927f5:packages/evals/questions/dev.yaml
  - a72f40f336aa4a3bfece96e5490469588c7927f5:packages/corpus/sql/profiling/20_http.sql

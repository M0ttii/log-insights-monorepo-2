name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format, architecture, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/serene-design (DESIGN.md)
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm deps:check
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build

  loader:
    # pnpm data:setup against the Loghub 2k samples and the loader integration
    # tests (technical.md § 7, LOG-11). SereneDB runs through compose.yaml, as
    # locally: the same port and the .data/raw mount the loader reads from;
    # data:setup starts it itself.
    #
    # Image: the official SereneDB 26.10.1 release, pinned by the digest of
    # its registry index (linux/amd64 only, source commit 3d12e1a8, the same
    # tag the local linux/arm64 build was made from). The unofficial ARM64
    # build is not published and never used here. There is no fallback: the
    # loader pulls only this digest, checks the server version, and the
    # samples test fails unless the server reports SereneDB 26.10.1.
    name: Loader against SereneDB (Loghub 2k samples)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERENEDB_CI_IMAGE: serenedb/serenedb:26.10.1@sha256:6d41ac6577e797289158786a2015ba8fbd6875feadb5c491518e166c011058c9
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/serene-design (DESIGN.md)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env with a throwaway SereneDB password and the CI image
        run: |
          sed -e "s/^SERENEDB_PASSWORD=$/SERENEDB_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s|^SERENEDB_IMAGE=.*|SERENEDB_IMAGE=${SERENEDB_CI_IMAGE}|" \
              .env.example > .env
          grep -qx "SERENEDB_IMAGE=${SERENEDB_CI_IMAGE}" .env
      - run: pnpm --silent data:setup --samples
      # The five Loghub extensions (U26) into log_insights_samples_ext, so the
      # extension integration tests have their database next to the base one.
      - run: pnpm --silent data:setup --samples --with all
      - run: pnpm test:integration
      - name: MCP stdio smoke (Loghub 2k samples)
        run: pnpm test:mcp
      - name: Stop SereneDB
        if: always()
        run: docker compose down -v

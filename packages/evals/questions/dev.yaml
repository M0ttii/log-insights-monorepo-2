questions:
  # ----------------------------------------------------------- clarification
  - id: dev-clarify-01
    kind: routing_control
    role: null
    effective_role: null
    covers: [S-14]
    question: I need an analysis of the BGL logs.
    scope: { dataset: bgl }
    required_evidence:
      - a clarification of the user's perspective or decision before a role answer
      - no analytical recommendation before that clarification
    distinguishing_check: >-
      The request names a corpus but gives no diagnostic, team-review or
      allocation goal. Ask which perspective is needed rather than selecting
      a role without enough information.
    allowed_tool_sequences:
      - [describe_corpus]
      - []

  # ---------------------------------------------------------------- engineer
  - id: dev-eng-01
    kind: role_answer
    role: engineer
    effective_role: engineer
    demo: true
    covers: [S-02, S-15]
    question: >-
      On BGL in June 2005, ciod repeatedly failed to read the message prefix
      on the control stream. Is this one bad node or something job-wide, and
      what should I check next?
    scope:
      { dataset: bgl, from: "2005-06-01T00:00:00Z", to: "2005-07-01T00:00:00Z" }
    required_evidence:
      - total matches of the failure text (search_logs, total_matches, not hits)
      - neighbourhood of one occurrence (get_log_context mode event)
      - breadth by node and rack (count_events group_by node or rack)
      - precursor analysis over episode starts (get_log_context mode aggregate)
      - anchor and baseline scope, window and truncation from the executed aggregate receipt
      - each hypothesis status justified by the discriminating check's fact IDs
      - dataset label APPREAD named as a dataset label, not a finding
    distinguishing_check: >-
      Use the executed June-scoped node/rack counts to test symptom
      confinement. Broad emitting-node distribution can contradict symptoms
      confined to one node; it cannot exclude a single initiating node or
      shared component. Month totals do not establish per-episode synchrony.
      Execute aggregate context for the requested June anchors and baseline,
      preserving the receipt's window. A precursor and its relative frequency
      can support a temporal association, never prove a cause or refute an
      initiating origin. Missing or mixed causal evidence leaves that origin
      open. Do not assign precursor counts to particular anchors without
      per-anchor evidence; proposed next checks also obey R-07/R-11.
    allowed_tool_sequences:
      - [
          search_logs,
          get_log_context,
          count_events,
          get_log_context,
          check_claims,
        ]
      - [
          search_logs,
          count_events,
          get_log_context,
          get_log_context,
          check_claims,
        ]
    reference:
      pattern_id: 287312f13c189c4d
      events: 5983
      episodes: 7
      nodes: 512
      racks: 32
      precursor: "chdir failed before 6 of 7 episode starts, 0.5–1.3 s earlier; base rate 0.0027 of 10-min windows"

  - id: dev-eng-02
    kind: role_answer
    role: engineer
    effective_role: engineer
    covers: [S-15]
    question: >-
      For BGL's "data TLB error interrupt", is the event volume concentrated
      on a few nodes or spread across the system?
    scope: { dataset: bgl }
    required_evidence:
      - events and episodes of the pattern (recurring_patterns)
      - concentration by node (count_events group_by node, top_n)
      - one occurrence with neighbourhood on the same node (get_log_context same_node)
    distinguishing_check: >-
      Use node counts with their total and any unlisted remainder to test
      concentration of the event volume. Use scoped episode evidence to
      distinguish one burst from repeated observations. Limit the conclusion
      to the observed symptom distribution; neither concentration nor broad
      distribution alone establishes the initiating cause.
    allowed_tool_sequences:
      - [recurring_patterns, count_events, get_log_context, check_claims]
      - [
          search_logs,
          recurring_patterns,
          count_events,
          get_log_context,
          check_claims,
        ]
    reference:
      pattern_id: d7c28809f189ee67
      events: 152734
      episodes: 22
      largest_episode: "152,182 events on 1 node, 2005-06-12, 382 min"

  - id: dev-eng-03
    kind: role_answer
    role: engineer
    effective_role: engineer
    covers: [S-06]
    question: Show me the parity errors on BGL.
    scope: { dataset: bgl }
    required_evidence:
      - search limit 50, exact total_matches, returned hits and truncation from the receipt; S-06 requires more than 50 matches in this run
      - frequency statements only from count_events, never from the hits
    distinguishing_check: >-
      Aggregate the matching scope by pattern and level before calling the
      matches errors. Preserve the observed levels and corrected-message
      distinction; do not assume that parity means error or infer a majority
      from the returned search examples. If this data version has no more
      than 50 matches, report the S-06 scenario as unexercised.
    allowed_tool_sequences:
      - [search_logs, count_events, check_claims]
    reference:
      full_text_matches_parity: 121498

  - id: dev-eng-04
    kind: role_answer
    role: null
    effective_role: engineer
    covers: [S-07, S-14]
    question: Did nova-compute log any segmentation fault?
    scope: { dataset: openstack, component: nova-compute }
    required_evidence:
      - role recognised as engineer from the diagnostic question without a role prompt
      - explicit "no matching events" with the scope searched
    distinguishing_check: >-
      The executed search determines whether the requested text is absent
      from nova-compute in the stated OpenStack scope. Report the actual
      result and scope without inventing evidence or treating absence as proof
      that no fault occurred. If matches exist, do not force the historical
      zero: report S-07 as unexercised on this data version.
    allowed_tool_sequences:
      - [search_logs, check_claims]
      - [search_logs, count_events, check_claims]
    reference:
      matches: 0

  - id: dev-eng-05
    kind: role_answer
    role: engineer
    effective_role: engineer
    demo: true
    covers: [S-02]
    question: >-
      Why did the OpenStack API return 503 on 17 May 2017 around 06:25 UTC?
    scope:
      {
        dataset: openstack,
        from: "2017-05-17T06:00:00Z",
        to: "2017-05-17T07:00:00Z",
      }
    required_evidence:
      - 5xx accesses with numerator and denominator (latency_stats group_by status)
      - the request's other lines (get_log_context scope same_request)
      - latency in the hour versus the rest of the day (latency_stats group_by hour)
    distinguishing_check: >-
      Check the actual same-request context for identity-validation errors
      before the 503, keeping context scope separate from the hourly API
      population and the comparison period. State only the returned temporal
      association. The identity service's own cause remains unknown without
      its evidence; a repeated sequence on another day needs its own query.
    allowed_tool_sequences:
      - [
          latency_stats,
          search_logs,
          get_log_context,
          latency_stats,
          check_claims,
        ]
      - [
          search_logs,
          get_log_context,
          latency_stats,
          latency_stats,
          check_claims,
        ]
    reference:
      api_accesses_total: 98733
      status_5xx_total: 2
      request_id: req-abcdb287-429c-40a5-8e79-d490d4fb7410

  # --------------------------------------------------------------- team lead
  - id: dev-tl-01
    kind: role_answer
    role: team_lead
    effective_role: team_lead
    demo: true
    covers: [S-03]
    question: >-
      Which recurring problems did Workload Runtime have on BGL in June 2005,
      and what should the team investigate first?
    scope:
      {
        dataset: bgl,
        team: Workload Runtime,
        from: "2005-06-01T00:00:00Z",
        to: "2005-07-01T00:00:00Z",
      }
    required_evidence:
      - recurring patterns with episodes, active days and breadth (recurring_patterns)
      - weekly trend of the leading pattern (event_trend bucket week)
      - recommendation names the team and the check to run
    distinguishing_check: >-
      Recurring (two or more episodes) versus a single burst: many lines in
      one episode is not recurring (A-10).
    allowed_tool_sequences:
      - [recurring_patterns, event_trend, check_claims]
      - [count_events, recurring_patterns, event_trend, check_claims]

  - id: dev-tl-02
    kind: role_answer
    role: team_lead
    effective_role: team_lead
    covers: [S-03]
    question: >-
      For Compute Platform on BGL, compare 14–28 November 2005 with the two
      weeks before. What is escalating?
    scope:
      {
        dataset: bgl,
        team: Compute Platform,
        from: "2005-11-14T00:00:00Z",
        to: "2005-11-28T00:00:00Z",
      }
    required_evidence:
      - comparison with C, B, C − B and the R-06 classification (count_events compare)
      - pattern status per R-10 (recurring_patterns)
    distinguishing_check: >-
      "Significantly increased" only at B > 0, at least doubling and at least
      20 more events; first observed patterns are named as such.
    allowed_tool_sequences:
      - [count_events, recurring_patterns, check_claims]
      - [recurring_patterns, count_events, check_claims]

  - id: dev-tl-03
    kind: role_answer
    role: team_lead
    effective_role: team_lead
    covers: [S-03]
    question: >-
      Which OpenStack warnings and errors recur, and which team owns them?
    scope: { dataset: openstack }
    required_evidence:
      - recurring error and warning patterns with episodes and team (recurring_patterns)
      - distribution by team (count_events group_by team)
    distinguishing_check: >-
      Repeated traceback patterns may describe the same failure pass.
      Identical episode counts alone do not establish that relationship:
      inspect event context before grouping them, or keep the possible link
      open. Report patterns and episodes as those units, never as a count of
      incidents or independent causes. Ownership is fictional.
    allowed_tool_sequences:
      - [recurring_patterns, count_events, check_claims]
      - [
          recurring_patterns,
          count_events,
          search_logs,
          get_log_context,
          check_claims,
        ]
    reference:
      image_cache_manager_pass_errors: "8 occurrences, each its own episode"

  - id: dev-tl-04
    kind: role_answer
    role: null
    effective_role: team_lead
    covers: [S-14]
    question: >-
      My team runs the API gateway. What keeps coming back in OpenStack, and
      what should we look at this week?
    scope: { dataset: openstack, team: API Gateway }
    required_evidence:
      - role recognised as team lead from the question (playbook core sections)
      - recurring patterns for the team (recurring_patterns)
    distinguishing_check: Recurring versus one-off, as dev-tl-01.
    allowed_tool_sequences:
      - [describe_corpus, recurring_patterns, latency_stats, check_claims]
      - [recurring_patterns, latency_stats, check_claims]

  # ----------------------------------------------------------------- manager
  - id: dev-mgr-01
    kind: role_answer
    role: manager
    effective_role: manager
    demo: true
    covers: [S-04, S-16]
    question: What should we investigate first on BGL? At most three priorities.
    scope: { dataset: bgl }
    required_evidence:
      - investigation order with rank basis, candidates checked, leader per dimension (recurring_patterns rank investigation_order)
      - episodes, events, breadth, change and team per priority, separately
      - the R-09 limit and "business impact unknown"
    distinguishing_check: >-
      Compare the event-volume leader with the executed investigation order,
      naming the observed episode/breadth trade-off and ranking basis (R-09).
      Use the returned leader and candidate evidence, not a search sample or
      the historical reference rank. Breadth drops from the whole rank basis
      if any candidate lacks a node on any event. If this data version does
      not show the S-16 contrast, report the scenario as unexercised.
    allowed_tool_sequences:
      - [recurring_patterns, check_claims]
      - [describe_corpus, recurring_patterns, count_events, check_claims]
    reference:
      most_lines: "data TLB error interrupt: 152,734 events, 22 episodes, rank 218 by episodes"
      most_episodes: "instruction address: <ADDR>: 289 episodes, 22,791 nodes"

  - id: dev-mgr-02
    kind: role_answer
    role: manager
    effective_role: manager
    covers: [S-10]
    question: How much downtime and money did the BGL kernel errors cost us?
    scope: { dataset: bgl, component: KERNEL }
    required_evidence:
      - measurable frequency and breadth only (count_events, recurring_patterns)
      - downtime, cost and customer effect named as unknown
    distinguishing_check: No business figure is derived from log counts.
    allowed_tool_sequences:
      - [count_events, recurring_patterns, check_claims]
      - [recurring_patterns, check_claims]

  - id: dev-mgr-03
    kind: role_answer
    role: manager
    effective_role: manager
    covers: [S-05]
    question: How many events does each team have across all our logs?
    scope: { dataset: [bgl, openstack] }
    required_evidence:
      - counts per dataset and team over each full span, with unowned (count_events group_by dataset, team)
      - spans named; no combined trend across datasets
    distinguishing_check: >-
      Totals per dataset, labelled as totals over each full span (BGL
      2005–2006, OpenStack 2017).
    allowed_tool_sequences:
      - [count_events, check_claims]
      - [describe_corpus, count_events, check_claims]

  - id: dev-mgr-04
    kind: role_answer
    role: null
    effective_role: manager
    covers: [S-14]
    question: >-
      I have a leadership review tomorrow. Where should engineering effort go
      first on OpenStack?
    scope: { dataset: openstack }
    required_evidence:
      - role recognised as manager from the question
      - investigation order with trade-off and limit (recurring_patterns rank investigation_order)
      - API error rate with numerator and denominator (latency_stats)
    distinguishing_check: >-
      Use the executed candidate-coverage result: when instance breadth is
      not determinable for every candidate it drops from the whole rank
      basis, and the answer explains why. Preserve the API error-rate
      numerator and denominator and name the technical ranking's limits.
    allowed_tool_sequences:
      - [recurring_patterns, latency_stats, check_claims]
      - [describe_corpus, recurring_patterns, latency_stats, check_claims]

  - id: dev-common-engineer
    common_case: bgl-june-ciod
    kind: role_answer
    role: engineer
    effective_role: engineer
    covers: [S-13]
    question: >-
      Review the recurring BGL ciod control-stream message-prefix failures in
      June 2005. What does the evidence establish and what should happen next?
    scope:
      { dataset: bgl, from: "2005-06-01T00:00:00Z", to: "2005-07-01T00:00:00Z" }
    required_evidence:
      - raw ciod failure and event neighbourhood
      - scoped node/rack breadth and episode precursor evidence
      - executed discriminating check with hypothesis status and next diagnostic object
    distinguishing_check: >-
      Test symptom confinement using scoped breadth and temporal context; do not infer an initiating origin from broad distribution or a precursor.
    allowed_tool_sequences: [[]]

  - id: dev-common-team_lead
    common_case: bgl-june-ciod
    kind: role_answer
    role: team_lead
    effective_role: team_lead
    covers: [S-13]
    question: >-
      Review the recurring BGL ciod control-stream message-prefix failures in
      June 2005. What does the evidence establish and what should happen next?
    scope:
      { dataset: bgl, from: "2005-06-01T00:00:00Z", to: "2005-07-01T00:00:00Z" }
    required_evidence:
      - episodes and repetition for ciod within the common scope
      - trend compared with the prior period, preserving out-of-span unknowns
      - fictional owning team and a specific investigation or improvement decision
    distinguishing_check: >-
      Compare recurrence and trend against the stated prior period and inspect component/team distribution before recommending a team investigation.
    allowed_tool_sequences: [[]]

  - id: dev-common-manager
    common_case: bgl-june-ciod
    kind: role_answer
    role: manager
    effective_role: manager
    covers: [S-13]
    question: >-
      Review the recurring BGL ciod control-stream message-prefix failures in
      June 2005. What does the evidence establish and what should happen next?
    scope:
      { dataset: bgl, from: "2005-06-01T00:00:00Z", to: "2005-07-01T00:00:00Z" }
    required_evidence:
      - episodes and breadth as separate priority dimensions
      - dominance or explicit trade-off from the scoped portfolio
      - fictional owning team, allocation decision and missing business information
    distinguishing_check: >-
      Use episode and breadth evidence, dominance or a stated trade-off to choose an investigation priority; business impact remains unknown.
    allowed_tool_sequences: [[]]

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, format, architecture, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/serene-design (DESIGN.md)
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm deps:check
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for the web workspace
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  jury:
    name: Jury Docker Compose (fresh 2k sample load)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.jury.yaml
      COMPOSE_PROJECT_NAME: jury-ci
      LOG_INSIGHTS_DATA_MODE: samples
      SERENEDB_DATABASE: log_insights_samples
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure an ephemeral database password
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "SERENEDB_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build and start the complete jury stack
        run: docker compose up --build -d --wait --wait-timeout 600
      - name: Verify real sample counts, receipt storage and re-run
        run: |
          docker compose exec -T web node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:3000';
          const response = await fetch(`${base}/api/tools/count_events`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ group_by: ['dataset'] }),
          });
          assert.equal(response.status, 200);
          const body = await response.json();
          assert.equal(body.ok, true);
          assert.equal(body.result.data.total, 4000);
          assert.deepEqual(
            body.result.data.groups.map(({ dataset, events }) => [dataset, events]).sort(),
            [['bgl', 2000], ['openstack', 2000]],
          );
          const id = body.result.receipt.receipt_id;
          assert.match(id, /^r_[0-9a-f]{8}$/);
          assert.equal((await fetch(`${base}/api/receipts/${id}`)).status, 200);
          const rerun = await fetch(`${base}/api/receipts/${id}/rerun`, { method: 'POST' });
          assert.equal(rerun.status, 200);
          const repeated = await rerun.json();
          assert.equal(repeated.result.data.total, 4000);
          assert.notEqual(repeated.result.receipt.receipt_id, id);
          console.log('Jury stack: real sample counts, persisted receipt and re-run passed.');
          JS
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Stop the isolated jury stack
        if: always()
        run: docker compose down --volumes

  loader:
    # pnpm data:setup against the Loghub 2k samples and the loader integration
    # tests (technical.md § 7, LOG-11). SereneDB runs through compose.yaml, as
    # locally: the same port and the .data/raw mount the loader reads from;
    # data:setup starts it itself.
    #
    # Image: the official SereneDB 26.10.1 release, pinned by the digest of
    # its registry index (linux/amd64 only, source commit 3d12e1a8, the same
    # tag the local linux/arm64 build was made from). The unofficial ARM64
    # build is not published and never used here. There is no fallback: the
    # loader pulls only this digest, checks the server version, and the
    # samples test fails unless the server reports SereneDB 26.10.1.
    name: Loader against SereneDB (Loghub 2k samples)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERENEDB_CI_IMAGE: serenedb/serenedb:26.10.1@sha256:6d41ac6577e797289158786a2015ba8fbd6875feadb5c491518e166c011058c9
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/serene-design (DESIGN.md)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create .env with a throwaway SereneDB password and the CI image
        run: |
          sed -e "s/^SERENEDB_PASSWORD=$/SERENEDB_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s|^SERENEDB_IMAGE=.*|SERENEDB_IMAGE=${SERENEDB_CI_IMAGE}|" \
              .env.example > .env
          grep -qx "SERENEDB_IMAGE=${SERENEDB_CI_IMAGE}" .env
      - run: pnpm --silent data:setup --samples
      # The five Loghub extensions (U26) into log_insights_samples_ext, so the
      # extension integration tests have their database next to the base one.
      - run: pnpm --silent data:setup --samples --with all
      # OpenTelemetry fixtures and bounded OTLP/HTTP replay (LOG-35), all
      # local inputs in log_insights_samples_otel; no public bucket access.
      - run: pnpm --silent data:setup --samples --with otel,otel_replay
      - run: pnpm test:integration
      - name: MCP stdio smoke (Loghub 2k samples)
        run: pnpm test:mcp
      - name: Stop SereneDB
        if: always()
        run: docker compose down -v

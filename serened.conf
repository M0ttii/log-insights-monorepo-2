# SereneDB configuration file
#
# Repository copy of the image's /etc/serenedb/serened.conf (SereneDB 26.10.1,
# copied from the local arm64 build of tag v26.10.1, commit 3d12e1a8, the
# source of the official amd64 image as well) with one change: two
# OTLP/HTTP listeners for the otel_replay dataset (LOG-35,
# technical.md § 5.1, § 7.2). compose.yaml mounts this file read-only at
# /etc/serenedb/serened.conf; the image entrypoint copies it to
# /tmp/serened.conf and appends --flagfile, so a --listen on the command line
# would lose against this file (LOG-35 probe § 7.7).
#
# This file is an absl flagfile: one '--flag=value' per line, '#' starts a
# comment line, blank lines are ignored. serened reads it via
# '--flagfile=/etc/serenedb/serened.conf' (see the systemd unit). Run
# 'serened --helpfull' to list every available flag.

# Path to the database directory.
--server_directory=/var/lib/serenedb

# Endpoint(s) the server listens on. Comma-separate for multiple endpoints
# (a repeated --listen is last-wins, not additive).
#  postgres://ipv4-address:port
#  postgres://[ipv6-address]:port
#  postgres:///path/to.sock  (unix domain socket)
#
# Examples:
#   --listen=postgres://0.0.0.0:7890
#   --listen=postgres://0.0.0.0:7890,postgres://[::]:7890
#
# Log Insights: besides the pg-wire listener, one OTLP/HTTP listener per
# database the tools read (an HTTP listener serves exactly one database and
# schema; the OTel tables are created there at startup):
#   4318  database postgres (SERENEDB_DATABASE of the full corpus), schema otlp
#   4319  database log_insights_samples_otel (pnpm data:setup --samples
#         --with otel_replay, CI), schema otlp
# Both bind 0.0.0.0 inside the container (a 127.0.0.1 bind is unreachable
# through Docker port publishing, probe § 7.6); compose.yaml publishes them
# on 127.0.0.1 only (SERENEDB_OTLP_PORT, SERENEDB_OTLP_SAMPLES_PORT). Exports
# need HTTP Basic auth with a SereneDB role. packages/corpus/src/otlp.ts
# mirrors this mapping; a unit test reads this file.
--listen=postgres://0.0.0.0:7890,http://0.0.0.0:4318?api=otel&schema=otlp,http://0.0.0.0:4319?api=otel&db=log_insights_samples_otel&schema=otlp

# Minimum log severity: trace | debug | info | warning | error | fatal.
--log_level=info

# Log destination at process start:
#   stdout  -- captured by systemd/journald (default)
#   memory  -- queryable via SELECT * FROM duckdb_logs()
#   file    -- written to --log_path below
--log_storage=stdout

# Filesystem destination, used only when --log_storage=file. A path ending in
# '.csv' is written as a single log file; any other path is treated as a
# directory that log CSVs are written into.
# --log_path=/var/log/serenedb
